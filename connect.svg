<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="300">
  <defs>
    <linearGradient id="conBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.6" />
    </linearGradient>

    <pattern id="conDotsGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.035" />
    </pattern>

    <style>
      .con-mono { font-family: 'JetBrains Mono', monospace; }
      .con-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes conArrowNudge {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(6px); }
      }
      .con-nudge { animation: conArrowNudge 1.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="920" height="300" rx="20" fill="#0d0e16" />
  <rect width="920" height="300" rx="20" fill="url(#conDotsGrid)" />
  <rect width="918" height="298" x="1" y="1" rx="19" fill="none" stroke="url(#conBorderGrad)" stroke-width="1.2" />

  <!-- Left: Character pointing right -->
  <g transform="translate(45, 10)">
    
  </g>

  <!-- Right: Connection Link Cards -->
  <g transform="translate(365, 38)">
    <text class="con-sans" x="0" y="0" fill="#f8fafc" font-size="22" font-weight="800">Let's connect & build together.</text>
    <text class="con-sans" x="0" y="24" fill="#94a3b8" font-size="13">Available for software engineering roles, open-source projects, or tech chats.</text>

    <!-- Email Card -->
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="495" height="50" rx="10" fill="#141624" stroke="#25283d" stroke-width="1" />
      <path d="M20 18 L32 28 L44 18" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
      <rect x="18" y="17" width="28" height="18" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.5" />
      <text class="con-sans" x="58" y="30" fill="#f8fafc" font-size="13.5" font-weight="600">Email Directly</text>
      <text class="con-mono" x="175" y="30" fill="#94a3b8" font-size="12">EngRajat2@gmail.com</text>
      <path class="con-nudge" d="M465 25 L458 20 M465 25 L458 30" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <!-- GitHub Card -->
    <g transform="translate(0, 106)">
      <rect x="0" y="0" width="495" height="50" rx="10" fill="#141624" stroke="#25283d" stroke-width="1" />
      <path d="M32 17 C26.48 17 22 21.48 22 27 C22 31.42 24.87 35.16 28.84 36.49 C29.34 36.58 29.53 36.27 29.53 36.01 C29.53 35.77 29.52 34.98 29.52 34.14 C26.74 34.74 26.15 32.91 26.15 32.91 C25.7 31.75 25.04 31.45 25.04 31.45 C24.13 30.83 25.11 30.84 25.11 30.84 C26.12 30.91 26.65 31.88 26.65 31.88 C27.55 33.42 28.98 32.98 29.56 32.72 C29.65 32.06 29.91 31.62 30.2 31.37 C27.98 31.12 25.64 30.26 25.64 26.43 C25.64 25.34 26.03 24.44 26.67 23.74 C26.57 23.49 26.22 22.46 26.77 21.08 C26.77 21.08 27.61 20.81 29.52 22.11 C30.32 21.89 31.17 21.78 32.02 21.78 C32.87 21.78 33.72 21.89 34.52 22.11 C36.43 20.81 37.27 21.08 37.27 21.08 C37.82 22.46 37.47 23.49 37.37 23.74 C38.01 24.44 38.4 25.34 38.4 26.43 C38.4 30.27 36.05 31.11 33.82 31.36 C34.18 31.67 34.5 32.28 34.5 33.22 C34.5 34.56 34.49 35.64 34.49 35.97 C34.49 36.24 34.67 36.55 35.18 36.45 C39.15 35.12 42 31.39 42 27 C42 21.48 37.52 17 32 17 Z" fill="#a78bfa" />
      <text class="con-sans" x="58" y="30" fill="#f8fafc" font-size="13.5" font-weight="600">GitHub</text>
      <text class="con-mono" x="175" y="30" fill="#94a3b8" font-size="12">github.com/engrajat2-sudo</text>
      <path class="con-nudge" d="M465 25 L458 20 M465 25 L458 30" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Location / Telegram Card -->
    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="495" height="50" rx="10" fill="#141624" stroke="#25283d" stroke-width="1" />
      <path d="M22 28 L38 20 L32 34 L28 30 L26 33 L25 29 Z" fill="#f472b6" />
      <text class="con-sans" x="58" y="30" fill="#f8fafc" font-size="13.5" font-weight="600">Community / Hub</text>
      <text class="con-mono" x="175" y="30" fill="#94a3b8" font-size="12">Meerut, UP, India</text>
      <path class="con-nudge" d="M465 25 L458 20 M465 25 L458 30" stroke="#f472b6" stroke-width="2" stroke-linecap="round" fill="none" />
