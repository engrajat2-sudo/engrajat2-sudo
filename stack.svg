<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="380">
  <defs>
    <radialGradient id="stkCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d0e16" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="stkBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5" />
    </linearGradient>

    <pattern id="stkDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.03" />
    </pattern>

    <style>
      .stk-mono { font-family: 'JetBrains Mono', monospace; }
      .stk-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      /* Sequenced Chip Glow */
      @keyframes stkGlowSequence {
        0%, 100% { stroke: #23273e; stroke-width: 1; }
        25% { stroke: #22d3ee; stroke-width: 1.6; filter: drop-shadow(0 0 5px #22d3ee); }
        50% { stroke: #a78bfa; stroke-width: 1.6; filter: drop-shadow(0 0 5px #a78bfa); }
        75% { stroke: #f472b6; stroke-width: 1.6; filter: drop-shadow(0 0 5px #f472b6); }
      }
      .stk-c1 { animation: stkGlowSequence 6s infinite 0s; }
      .stk-c2 { animation: stkGlowSequence 6s infinite 1.5s; }
      .stk-c3 { animation: stkGlowSequence 6s infinite 3s; }
      .stk-c4 { animation: stkGlowSequence 6s infinite 4.5s; }
    </style>
  </defs>

  <rect width="920" height="380" rx="20" fill="#0d0e16" />
  <rect width="920" height="380" rx="20" fill="url(#stkDots)" />
  <rect width="918" height="378" x="1" y="1" rx="19" fill="none" stroke="url(#stkBorder)" stroke-width="1.2" />

  <!-- Left Side: Planetary System -->
  <g transform="translate(225, 190)">
    <!-- Core Glow & Python/C Core -->
    <circle cx="0" cy="0" r="65" fill="url(#stkCoreGlow)" />
    <circle cx="0" cy="0" r="28" fill="#131626" stroke="#22d3ee" stroke-width="2" />
    <text class="stk-mono" x="-14" y="6" fill="#22d3ee" font-size="15" font-weight="800">PY</text>

    <!-- Orbit 1: Inner (radius 95x50) -->
    <ellipse cx="0" cy="0" rx="95" ry="50" fill="none" stroke="#23273e" stroke-width="1" stroke-dasharray="3 3" transform="rotate(-20)" />

    <!-- Orbit 2: Middle for React (radius 148x74) -->
    <ellipse cx="0" cy="0" rx="148" ry="74" fill="none" stroke="#2a304d" stroke-width="1.2" transform="rotate(15)" />

    <!-- Orbit 3: Outer (radius 195x90) -->
    <ellipse cx="0" cy="0" rx="195" ry="90" fill="none" stroke="#23273e" stroke-width="1" stroke-dasharray="4 4" transform="rotate(-10)" />

    <!-- Java Planet on Orbit 1 -->
    <g transform="rotate(-20)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite" />
        <g transform="translate(95, 0)">
          <circle cx="0" cy="0" r="13" fill="#141728" stroke="#f472b6" stroke-width="1.6" />
          <text class="stk-mono" x="-7" y="4" fill="#f472b6" font-size="9.5" font-weight="700">JV</text>
        </g>
      </g>
    </g>

    <!-- React Planet with 2 Small Moons (Vite & Next) on Orbit 2 -->
    <g transform="rotate(15)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
        <g transform="translate(148, 0)">
          <!-- Counter-rotate to stabilize planet icon -->
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite" />
          
          <circle cx="0" cy="0" r="17" fill="#141728" stroke="#61dafb" stroke-width="1.8" />
          <!-- React glyph -->
          <ellipse cx="0" cy="0" rx="9" ry="3.5" fill="none" stroke="#61dafb" stroke-width="0.9" />
          <ellipse cx="0" cy="0" rx="9" ry="3.5" fill="none" stroke="#61dafb" stroke-width="0.9" transform="rotate(60)" />
          <ellipse cx="0" cy="0" rx="9" ry="3.5" fill="none" stroke="#61dafb" stroke-width="0.9" transform="rotate(120)" />
          <circle cx="0" cy="0" r="1.5" fill="#61dafb" />

          <!-- Moon 1: Vite (Radius clearance 26px) -->
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
            <circle cx="26" cy="0" r="6" fill="#0f111c" stroke="#a78bfa" stroke-width="1.2" />
            <text class="stk-mono" x="23" y="3" fill="#a78bfa" font-size="7" font-weight="700">V</text>
          </g>

          <!-- Moon 2: Next.js (Radius clearance 26px opposite) -->
          <g>
            <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="4s" repeatCount="indefinite" />
            <circle cx="26" cy="0" r="6" fill="#0f111c" stroke="#22d3ee" stroke-width="1.2" />
            <text class="stk-mono" x="24" y="3" fill="#22d3ee" font-size="7" font-weight="700">N</text>
          </g>
        </g>
      </g>
    </g>

    <!-- C Language Planet on Orbit 3 -->
    <g transform="rotate(-10)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="25s" repeatCount="indefinite" />
        <g transform="translate(195, 0)">
          <circle cx="0" cy="0" r="14" fill="#141728" stroke="#38bdf8" stroke-width="1.5" />
          <text class="stk-mono" x="-4" y="4" fill="#38bdf8" font-size="10" font-weight="800">C</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Side: Grouped Stack Chip Grid -->
  <g transform="translate(470, 42)">
    <!-- Frontend -->
    <text class="stk-mono" x="0" y="14" fill="#22d3ee" font-size="11" font-weight="700" letter-spacing="1">01 // FRONTEND & WEB</text>
    <g transform="translate(0, 24)">
      <rect class="stk-c1" x="0" y="0" width="100" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="14" y="19" fill="#f8fafc" font-size="12">React.js</text>

      <rect class="stk-c2" x="110" y="0" width="105" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="124" y="19" fill="#f8fafc" font-size="12">Next.js</text>

      <rect class="stk-c3" x="225" y="0" width="95" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="237" y="19" fill="#f8fafc" font-size="12">HTML5/CSS3</text>

      <rect class="stk-c4" x="330" y="0" width="90" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="344" y="19" fill="#f8fafc" font-size="12">Tailwind</text>
    </g>

    <!-- Motion & 3D -->
    <text class="stk-mono" x="0" y="86" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1">02 // MOTION & UI DESIGN</text>
    <g transform="translate(0, 96)">
      <rect class="stk-c4" x="0" y="0" width="95" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="16" y="19" fill="#f8fafc" font-size="12">SVG SMIL</text>

      <rect class="stk-c1" x="105" y="0" width="95" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="120" y="19" fill="#f8fafc" font-size="12">Canvas</text>

      <rect class="stk-c2" x="210" y="0" width="105" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="225" y="19" fill="#f8fafc" font-size="12">CSS FX</text>

      <rect class="stk-c3" x="325" y="0" width="95" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="340" y="19" fill="#f8fafc" font-size="12">Figma</text>
    </g>

    <!-- Data & Backend -->
    <text class="stk-mono" x="0" y="158" fill="#f472b6" font-size="11" font-weight="700" letter-spacing="1">03 // CORE LANGUAGES & BACKEND</text>
    <g transform="translate(0, 168)">
      <rect class="stk-c3" x="0" y="0" width="95" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="16" y="19" fill="#f8fafc" font-size="12">Python</text>

      <rect class="stk-c4" x="105" y="0" width="90" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="120" y="19" fill="#f8fafc" font-size="12">C Lang</text>

      <rect class="stk-c1" x="205" y="0" width="85" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="222" y="19" fill="#f8fafc" font-size="12">Java</text>

      <rect class="stk-c2" x="300" y="0" width="120" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="315" y="19" fill="#f8fafc" font-size="12">PostgreSQL</text>
    </g>

    <!-- Dev & Environment -->
    <text class="stk-mono" x="0" y="230" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">04 // TOOLS & ENVIRONMENT</text>
    <g transform="translate(0, 240)">
      <rect class="stk-c2" x="0" y="0" width="90" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="18" y="19" fill="#f8fafc" font-size="12">Git/CLI</text>

      <rect class="stk-c3" x="100" y="0" width="90" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="116" y="19" fill="#f8fafc" font-size="12">Docker</text>

      <rect class="stk-c4" x="200" y="0" width="105" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="216" y="19" fill="#f8fafc" font-size="12">FastAPI</text>

      <rect class="stk-c1" x="315" y="0" width="105" height="30" rx="8" fill="#141728" />
      <text class="stk-mono" x="330" y="19" fill="#f8fafc" font-size="12">Linux/WSL</text>
    </g>
  </g>
</svg>
