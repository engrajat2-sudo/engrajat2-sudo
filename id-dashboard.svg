<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="400">
  <defs>
    <linearGradient id="idCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Holographic Sweeper -->
    <linearGradient id="idHoloSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>

    <pattern id="idDots2" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.035" />
    </pattern>

    <style>
      .id-mono { font-family: 'JetBrains Mono', monospace; }
      .id-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      /* Damped Pendulum Swing */
      @keyframes idBadgeSwing {
        0% { transform: rotate(15deg); }
        22% { transform: rotate(-10deg); }
        44% { transform: rotate(5deg); }
        66% { transform: rotate(-2.5deg); }
        84% { transform: rotate(1deg); }
        100% { transform: rotate(0deg); }
      }
      .id-assembly {
        transform-origin: 140px 0px;
        animation: idBadgeSwing 4.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      /* Holographic Sweep */
      @keyframes idSweepFx {
        0% { transform: translateX(-140px) skewX(-20deg); }
        50%, 100% { transform: translateX(340px) skewX(-20deg); }
      }
      .id-holo { animation: idSweepFx 4.2s ease-in-out infinite; }

      /* Bar Charts Growth */
      @keyframes idBarG1 { 0% { width: 0; } 100% { width: 210px; } }
      @keyframes idBarG2 { 0% { width: 0; } 100% { width: 165px; } }
      @keyframes idBarG3 { 0% { width: 0; } 100% { width: 125px; } }
      .id-b1 { animation: idBarG1 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .id-b2 { animation: idBarG2 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .id-b3 { animation: idBarG3 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
  </defs>

  <rect width="920" height="400" rx="20" fill="#0d0e16" />
  <rect width="920" height="400" rx="20" fill="url(#idDots2)" />
  <rect width="918" height="398" x="1" y="1" rx="19" fill="none" stroke="url(#idCardBorder)" stroke-width="1.2" />

  <!-- Left: Hanging ID Badge Assembly -->
  <g class="id-assembly">
    <!-- Lanyard Strap with Print -->
    <path d="M 125 -10 L 125 45 L 155 45 L 155 -10 Z" fill="#181a28" />
    <text class="id-mono" x="-38" y="142" fill="#64748b" font-size="8" font-weight="700" letter-spacing="1.5" transform="rotate(-90)">SYSTEMS VERIFIED</text>
    
    <!-- Clasp -->
    <rect x="127" y="44" width="26" height="18" rx="3" fill="#64748b" />
    <rect x="134" y="54" width="12" height="16" rx="2" fill="#334155" />

    <!-- Badge Card -->
    <g transform="translate(30, 68)">
      <rect width="220" height="305" rx="14" fill="#121424" stroke="#25283d" stroke-width="1.5" />

      <!-- Foil Sweep Layer -->
      <g clip-path="inset(0 0 0 0 round 14px)">
        <rect class="id-holo" x="0" y="0" width="85" height="305" fill="url(#idHoloSweep)" />
      </g>

      <!-- Badge Slot -->
      <rect x="85" y="10" width="50" height="6" rx="3" fill="#080910" />

      <!-- Avatar Photo & Traveling Border Light -->
      <g transform="translate(35, 28)">
        <rect width="150" height="135" rx="10" fill="#080910" stroke="url(#idCardBorder)" stroke-width="1.5" />
        
        
        <!-- Traveling Border Light (SMIL) -->
        <circle cx="0" cy="0" r="3" fill="#22d3ee" filter="drop-shadow(0 0 4px #22d3ee)">
          <animateMotion path="M 5 5 L 145 5 L 145 130 L 5 130 Z" dur="4s" repeatCount="indefinite" />
        </circle>
      </g>

      <!-- Gold Smart Chip -->
      <g transform="translate(35, 175)">
        <rect width="32" height="24" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
        <line x1="0" y1="12" x2="32" y2="12" stroke="#d97706" stroke-width="0.8" />
        <line x1="16" y1="0" x2="16" y2="24" stroke="#d97706" stroke-width="0.8" />
      </g>

      <text class="id-sans" x="78" y="188" fill="#f8fafc" font-size="14.5" font-weight="800">RAJAT</text>
      <text class="id-mono" x="78" y="202" fill="#22d3ee" font-size="9" font-weight="600">ROLE: ENGINEER</text>

      <!-- Barcode Graphic -->
      <g transform="translate(35, 235)">
        <rect x="0" y="0" width="3" height="30" fill="#f8fafc" />
        <rect x="6" y="0" width="1.5" height="30" fill="#f8fafc" />
        <rect x="11" y="0" width="4.5" height="30" fill="#f8fafc" />
        <rect x="19" y="0" width="2" height="30" fill="#f8fafc" />
        <rect x="25" y="0" width="5" height="30" fill="#f8fafc" />
        <rect x="34" y="0" width="2" height="30" fill="#f8fafc" />
        <rect x="40" y="0" width="4" height="30" fill="#f8fafc" />
        <rect x="48" y="0" width="2.5" height="30" fill="#f8fafc" />
        <rect x="56" y="0" width="5.5" height="30" fill="#f8fafc" />
        <rect x="66" y="0" width="2" height="30" fill="#f8fafc" />
        <rect x="73" y="0" width="4" height="30" fill="#f8fafc" />
        <rect x="82" y="0" width="2" height="30" fill="#f8fafc" />
        <rect x="89" y="0" width="5" height="30" fill="#f8fafc" />
        <rect x="98" y="0" width="2" height="30" fill="#f8fafc" />
        <rect x="105" y="0" width="4" height="30" fill="#f8fafc" />
        <rect x="114" y="0" width="2" height="30" fill="#f8fafc" />
        <rect x="120" y="0" width="5.5" height="30" fill="#f8fafc" />
        <rect x="130" y="0" width="3" height="30" fill="#f8fafc" />
        <rect x="138" y="0" width="4" height="30" fill="#f8fafc" />
        <rect x="146" y="0" width="2" height="30" fill="#f8fafc" />
      </g>
      <text class="id-mono" x="35" y="278" fill="#64748b" font-size="8">GITHUB // ENGRAJAT2-SUDO</text>
    </g>
  </g>

  <!-- Right: Dashboard & KPI Tiles -->
  <g transform="translate(300, 32)">
    <!-- KPI Row -->
    <g>
      <rect x="0" y="0" width="180" height="80" rx="12" fill="#141624" stroke="#25283d" stroke-width="1" />
      <text class="id-mono" x="18" y="24" fill="#94a3b8" font-size="10">TOTAL COMMITS</text>
      <text class="id-sans" x="18" y="58" fill="#22d3ee" font-size="28" font-weight="800">1,240+</text>

      <rect x="200" y="0" width="180" height="80" rx="12" fill="#141624" stroke="#25283d" stroke-width="1" />
      <text class="id-mono" x="218" y="24" fill="#94a3b8" font-size="10">LANGUAGES</text>
      <text class="id-sans" x="218" y="58" fill="#a78bfa" font-size="28" font-weight="800">4 Core</text>

      <rect x="400" y="0" width="180" height="80" rx="12" fill="#141624" stroke="#25283d" stroke-width="1" />
      <text class="id-mono" x="418" y="24" fill="#94a3b8" font-size="10">PIPELINES RUN</text>
      <text class="id-sans" x="418" y="58" fill="#f472b6" font-size="28" font-weight="800">99.8%</text>
    </g>

    <!-- Top Repos Single-Hue Bar Chart -->
    <g transform="translate(0, 105)">
      <rect width="380" height="235" rx="14" fill="#121422" stroke="#1f233a" stroke-width="1" />
      <text class="id-mono" x="20" y="28" fill="#f8fafc" font-size="11.5" font-weight="700">FEATURED REPOSITORIES // FOCUS</text>

      <g transform="translate(20, 52)">
        <text class="id-mono" x="0" y="14" fill="#94a3b8" font-size="11">python-core-engine</text>
        <rect x="130" y="3" width="210" height="14" rx="4" fill="#1c2033" />
        <rect class="id-b1" x="130" y="3" width="0" height="14" rx="4" fill="#22d3ee" />
        <text class="id-mono" x="350" y="14" fill="#cbd5e1" font-size="10">92★</text>
      </g>

      <g transform="translate(20, 102)">
        <text class="id-mono" x="0" y="14" fill="#94a3b8" font-size="11">modern-web-suite</text>
        <rect x="130" y="3" width="210" height="14" rx="4" fill="#1c2033" />
        <rect class="id-b2" x="130" y="3" width="0" height="14" rx="4" fill="#22d3ee" opacity="0.85" />
        <text class="id-mono" x="350" y="14" fill="#cbd5e1" font-size="10">64★</text>
      </g>

      <g transform="translate(20, 152)">
        <text class="id-mono" x="0" y="14" fill="#94a3b8" font-size="11">c-java-data-structs</text>
        <rect x="130" y="3" width="210" height="14" rx="4" fill="#1c2033" />
        <rect class="id-b3" x="130" y="3" width="0" height="14" rx="4" fill="#22d3ee" opacity="0.7" />
        <text class="id-mono" x="350" y="14" fill="#cbd5e1" font-size="10">45★</text>
      </g>
    </g>

    <!-- "Now" Panel -->
    <g transform="translate(400, 105)">
      <rect width="180" height="235" rx="14" fill="#121422" stroke="#1f233a" stroke-width="1" />
      <text class="id-mono" x="16" y="28" fill="#22d3ee" font-size="11" font-weight="700">NOW STATUS</text>

      <g transform="translate(16, 52)">
        <text class="id-mono" x="0" y="10" fill="#64748b" font-size="9">TARGET ROLE</text>
        <text class="id-sans" x="0" y="27" fill="#cbd5e1" font-size="12" font-weight="600">Software Engineer / Dev</text>
      </g>

      <g transform="translate(16, 108)">
        <text class="id-mono" x="0" y="10" fill="#64748b" font-size="9">LISTENING TO</text>
        <text class="id-sans" x="0" y="27" fill="#cbd5e1" font-size="12" font-weight="600">Lo-Fi & Ambient Synth</text>
      </g>

      <g transform="translate(16, 164)">
        <text class="id-mono" x="0" y="10" fill="#64748b" font-size="9">LOCATION</text>
        <text class="id-sans" x="0" y="27" fill="#cbd5e1" font-size="12" font-weight="600">Meerut, UP, India</text>
      </g>
    </g>
  </g>
</svg>
