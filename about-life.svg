<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="360">
  <defs>
    <linearGradient id="alCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e16" />
      <stop offset="100%" stop-color="#131526" />
    </linearGradient>

    <linearGradient id="alBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5" />
    </linearGradient>

    <pattern id="alDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.035" />
    </pattern>

    <style>
      .al-mono { font-family: monospace; }
      .al-sans { font-family: sans-serif; }
      @keyframes alCursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .al-cursor { animation: alCursorBlink 0.9s infinite; }
    </style>
  </defs>

  <!-- Left Card: Browser Window -->
  <g transform="translate(0, 0)">
    <rect width="445" height="360" rx="18" fill="url(#alCardBg)" />
    <rect width="445" height="360" rx="18" fill="url(#alDots)" />
    <rect width="443" height="358" x="1" y="1" rx="17" fill="none" stroke="url(#alBorder)" stroke-width="1.2" />

    <rect x="15" y="16" width="415" height="34" rx="8" fill="#141624" stroke="#25283d" stroke-width="1" />
    <circle cx="32" cy="33" r="4" fill="#ef4444" />
    <circle cx="46" cy="33" r="4" fill="#f59e0b" />
    <circle cx="60" cy="33" r="4" fill="#10b981" />

    <rect x="76" y="21" width="345" height="24" rx="5" fill="#090a12" />
    <text class="al-mono" x="88" y="37" fill="#64748b" font-size="11">https://rajat.dev/capabilities<tspan fill="#22d3ee" class="al-cursor">_</tspan></text>

    <!-- Capabilities Rows -->
    <g transform="translate(18, 70)">
      <rect x="0" y="0" width="409" height="74" rx="12" fill="#141728" stroke="#1f233a" stroke-width="1" />
      <rect x="12" y="15" width="44" height="44" rx="8" fill="#22d3ee" fill-opacity="0.12" />
      <path d="M25 29 L39 29 M32 22 L32 36 M39 43 L25 43 M32 36 L32 50" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
      <text class="al-sans" x="68" y="33" fill="#f8fafc" font-size="14" font-weight="700">Python Engineering</text>
      <text class="al-sans" x="68" y="52" fill="#94a3b8" font-size="12">FastAPI backends, async queues and algorithmic tooling</text>

      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="409" height="74" rx="12" fill="#141728" stroke="#1f233a" stroke-width="1" />
        <rect x="12" y="15" width="44" height="44" rx="8" fill="#a78bfa" fill-opacity="0.12" />
        <path d="M26 37 L34 27 L42 37 M30 47 L38 47" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none" />
        <text class="al-sans" x="68" y="33" fill="#f8fafc" font-size="14" font-weight="700">Modern Web Applications</text>
        <text class="al-sans" x="68" y="52" fill="#94a3b8" font-size="12">High-performance frontend pipelines, clean UI architecture</text>
      </g>

      <g transform="translate(0, 168)">
        <rect x="0" y="0" width="409" height="74" rx="12" fill="#141728" stroke="#1f233a" stroke-width="1" />
        <rect x="12" y="15" width="44" height="44" rx="8" fill="#f472b6" fill-opacity="0.12" />
        <circle cx="34" cy="37" r="10" stroke="#f472b6" stroke-width="2" fill="none" />
        <path d="M34 31 L34 37 L38 37" stroke="#f472b6" stroke-width="2" stroke-linecap="round" />
        <text class="al-sans" x="68" y="33" fill="#f8fafc" font-size="14" font-weight="700">Low-Level Systems (C and Java)</text>
        <text class="al-sans" x="68" y="52" fill="#94a3b8" font-size="12">Memory management, multi-threaded algorithms, OOP</text>
      </g>
    </g>
  </g>

  <!-- Right Card: Hobbies & Daily Activity Rings -->
  <g transform="translate(475, 0)">
    <rect width="445" height="360" rx="18" fill="url(#alCardBg)" />
    <rect width="445" height="360" rx="18" fill="url(#alDots)" />
    <rect width="443" height="358" x="1" y="1" rx="17" fill="none" stroke="url(#alBorder)" stroke-width="1.2" />

    <g transform="translate(25, 20)">
      <rect x="0" y="0" width="125" height="3.5" rx="1.5" fill="#22d3ee" />
      <rect x="135" y="0" width="125" height="3.5" rx="1.5" fill="#a78bfa" />
      <rect x="270" y="0" width="125" height="3.5" rx="1.5" fill="#f472b6" />
    </g>

    <g transform="translate(25, 45)">
      <text class="al-mono" x="0" y="20" fill="#22d3ee" font-size="11.5" font-weight="700">01 // MUSIC AND SOUND LAB</text>
      <text class="al-sans" x="0" y="44" fill="#f8fafc" font-size="16" font-weight="800">Lo-Fi Beats and Audio Engineering</text>
      <text class="al-sans" x="0" y="66" fill="#94a3b8" font-size="13">Exploring synthesizer design, chill beats, and acoustics while coding.</text>
    </g>

    <g transform="translate(130, 235)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#1c2033" stroke-width="7" />
      <circle cx="0" cy="0" r="45" fill="none" stroke="#22d3ee" stroke-width="7" stroke-dasharray="283" stroke-dashoffset="42" stroke-linecap="round" transform="rotate(-90)" />

      <circle cx="0" cy="0" r="35" fill="none" stroke="#1c2033" stroke-width="7" />
      <circle cx="0" cy="0" r="35" fill="none" stroke="#a78bfa" stroke-width="7" stroke-dasharray="220" stroke-dashoffset="48" stroke-linecap="round" transform="rotate(-90)" />

      <circle cx="0" cy="0" r="25" fill="none" stroke="#1c2033" stroke-width="7" />
      <circle cx="0" cy="0" r="25" fill="none" stroke="#f472b6" stroke-width="7" stroke-dasharray="160" stroke-dashoffset="35" stroke-linecap="round" transform="rotate(-90)" />
    </g>

    <g transform="translate(215, 195)">
      <circle cx="0" cy="15" r="4.5" fill="#22d3ee" />
      <text class="al-mono" x="14" y="19" fill="#cbd5e1" font-size="11.5">Engineering (85%)</text>

      <circle cx="0" cy="40" r="4.5" fill="#a78bfa" />
      <text class="al-mono" x="14" y="44" fill="#cbd5e1" font-size="11.5">Music Focus (78%)</text>

      <circle cx="0" cy="65" r="4.5" fill="#f472b6" />
      <text class="al-mono" x="14" y="69" fill="#cbd5e1" font-size="11.5">Systems Focus (72%)</text>
    </g>
  </g>
</svg>
